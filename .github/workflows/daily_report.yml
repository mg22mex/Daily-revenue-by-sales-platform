name: Daily Revenue Report Pipeline

on:
  schedule:
    # Daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send daily email via Brevo?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-revenue-report
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Revenue Pipeline
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          WALMART_CLIENT_ID: ${{ secrets.WALMART_CLIENT_ID }}
          WALMART_CLIENT_SECRET: ${{ secrets.WALMART_CLIENT_SECRET }}
          SELLERBOARD_DAILY_URL: ${{ secrets.SELLERBOARD_DAILY_URL }}
          SELLERBOARD_PRODUCT_URL: ${{ secrets.SELLERBOARD_PRODUCT_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          SHOPIFY_AD_SPEND: ${{ secrets.SHOPIFY_AD_SPEND }}
          DASHBOARD_PUBLIC_URL: ${{ secrets.DASHBOARD_PUBLIC_URL }}
          REPORT_GREETING_NAME: ${{ secrets.REPORT_GREETING_NAME }}
          # Manual runs: skip email when send_email is false.
          # Scheduled runs have no inputs → expression is false → email sends.
          SKIP_EMAIL: ${{ github.event.inputs.send_email == 'false' }}
        run: python main.py

      - name: Commit dashboard + archive artifacts
        run: |
          if git diff --quiet -- docs data/daily_archive.json; then
            echo "No dashboard/archive changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/daily_archive.json
          git commit -m "data: refresh daily revenue dashboard"
          git push origin HEAD:main
