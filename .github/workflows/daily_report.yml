name: Daily Revenue Report Pipeline

on:
  schedule:
    # Runs daily at 08:00 UTC (02:00 CST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Daily Revenue Pipeline
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          WALMART_CLIENT_ID: ${{ secrets.WALMART_CLIENT_ID }}
          WALMART_CLIENT_SECRET: ${{ secrets.WALMART_CLIENT_SECRET }}
          SELLERBOARD_DAILY_URL: ${{ secrets.SELLERBOARD_DAILY_URL }}
          SELLERBOARD_PRODUCT_URL: ${{ secrets.SELLERBOARD_PRODUCT_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: python main.py