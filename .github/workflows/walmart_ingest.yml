name: Walmart daily sales relay

on:
  schedule:
    - cron: "20 14 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_walmart_sales.py"
      - ".github/workflows/walmart_ingest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walmart-daily-sales-relay
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prior-day Walmart sales
        env:
          WALMART_CLIENT_ID: ${{ secrets.WALMART_CLIENT_ID }}
          WALMART_CLIENT_SECRET: ${{ secrets.WALMART_CLIENT_SECRET }}
        run: python scripts/fetch_walmart_sales.py
      - name: Commit refreshed summary
        run: |
          if git diff --quiet -- data/walmart_daily_summary.json; then
            echo "No summary change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/walmart_daily_summary.json
          git commit -m "data: refresh Walmart daily summary"
          git push origin HEAD:main
